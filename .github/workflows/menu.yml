name: 기숙사 메뉴 갱신

on:
  schedule:
    - cron: "0 0 * * *"   # 한국 시간 매일 오전 9시
  workflow_dispatch:       # 손으로 바로 실행하는 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_menu.py
      - name: 바뀐 게 있을 때만 저장
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet || (git commit -m "메뉴 갱신" && git push)
